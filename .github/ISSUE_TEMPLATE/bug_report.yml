name: Signaler un problème
description: Signaler un comportement incorrect et reproductible.
title: "[Problème] : "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Que s'est-il passé ?
      description: Décrivez le comportement observé et le résultat attendu.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
      description: Utilisez uniquement le jeu d'exemple ou des données non sensibles.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
    validations:
      required: true

